name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Check the lazy chunk's size budget
        run: pnpm size

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render the gallery and run the design gate
        run: pnpm gallery && pnpm gate

      - name: Test
        run: pnpm test

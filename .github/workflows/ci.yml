name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Check the lazy chunk's size budget
        run: pnpm size

      - name: Install Playwright's Chromium
        run: pnpm --filter @geekchart/cli exec playwright install --with-deps chromium

      - name: Render the gallery and run the design gate (browser engine)
        run: pnpm gallery && pnpm gate

      - name: Render the gallery and run the design gate (Node engine)
        run: pnpm gallery --engine=node && pnpm gate --engine=node

      - name: Audit the packed tarball as a consumer would install it
        run: |
          pnpm --filter geekchart exec npm pack --pack-destination /tmp
          mkdir /tmp/audit && cd /tmp/audit && npm init -y >/dev/null
          npm install --no-fund /tmp/geekchart-*.tgz
          npm audit --audit-level=moderate

      - name: Test
        run: pnpm test

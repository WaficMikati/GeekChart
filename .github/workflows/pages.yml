name: Pages

# The gallery — every chart in the catalogue, drawn by the Node engine, with
# the light/dark toggle — and the benchmark report, published on every push
# to main at https://waficmikati.github.io/GeekChart/. No browser is
# involved: the page is the same inline SVG the library ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Render the gallery (Node engine)
        run: pnpm gallery --engine=node

      - name: Assemble the site
        run: |
          mkdir -p _site/benchmarks
          cp gallery-node.html _site/index.html
          cp docs/benchmarks/index.html _site/benchmarks/index.html
          cp docs/benchmarks/results.json _site/benchmarks/results.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

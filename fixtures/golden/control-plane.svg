<!-- panel 104..896 × 248..480, padding 24 (2.6); rx 12 (2.5) -->
<g class="gc-cluster">
  <rect class="panel t5" x="104" y="248" width="792" height="232" rx="12" pathLength="1"/>
  <text class="name t6" x="500" y="282" style="font-size:14px">Cohort engine</text>
  <text class="kicker t6" x="500" y="300" style="text-anchor:middle">16 WEEKS · 4 MODULES · 1 MENTOR PER 8 · DAILY FEEDBACK</text>

<circle class="dot in1" r="3" style="--p:path('M436 176 V248')"/><circle class="ripple in1" cx="436" cy="248" r="3"/>
<circle class="dot in2" r="3" style="--p:path('M660 176 V248')"/><circle class="ripple in2" cx="660" cy="248" r="3"/>
<circle class="dot in3" r="3" style="--p:path('M884 176 V248')"/><circle class="ripple in3" cx="884" cy="248" r="3"/>

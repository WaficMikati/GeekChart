<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" class="gc-chart gc-golden" role="img" aria-labelledby="gt gd">
<title id="gt">How a cohort runs on BreatheCode</title>
<desc id="gd">Four inputs feed a central cohort engine of six services, which produces four outputs. Applicants to graduates is the primary path.</desc>
<style>
  /* Golden: hand-drawn to DESIGN.md. Canvas 1000 wide, 8-grid, two type faces,
     one accent on the primary path, one thing moving at a time. */
  .gc-golden { --e: cubic-bezier(0.61, 0, 0.39, 1); font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; }
  .gc-golden .bg     { fill: var(--gc-bg, #17202A); }
  .gc-golden .title  { fill: var(--gc-ink, #FFFFFF); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .gc-golden .kicker { fill: var(--gc-quiet, #8794A3); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 8px; letter-spacing: 0.18em; }
  .gc-golden .name   { fill: var(--gc-ink, #FFFFFF); font-size: 12px; font-weight: 600; text-anchor: middle; }
  .gc-golden .cap    { fill: var(--gc-quiet, #8794A3); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 8.5px; text-anchor: middle; }
  .gc-golden .legend { fill: var(--gc-quiet, #8794A3); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 8px; letter-spacing: 0.1em; }
  .gc-golden .box    { fill: none; stroke: var(--gc-edge, #6B7889); stroke-width: 1.25; }
  .gc-golden .box.focus { stroke: var(--gc-path, #0084FF); }
  .gc-golden .panel  { fill: none; stroke: var(--gc-quiet, #8794A3); stroke-width: 1; opacity: .85; }
  .gc-golden .rule   { stroke: var(--gc-quiet, #8794A3); stroke-width: 0.8; opacity: .5; }
  .gc-golden .tile   { fill: var(--gc-surface, #232F3C); }
  .gc-golden .tile.focus { fill: none; stroke: var(--gc-path, #0084FF); stroke-width: 1.25; }
  .gc-golden .chan   { fill: none; stroke: var(--gc-edge, #6B7889); stroke-width: 1.2; stroke-dasharray: 1.5 6; stroke-linecap: round; }
  .gc-golden .chan.focus { stroke: var(--gc-path, #0084FF); stroke-dasharray: none; stroke-width: 1.6; }
  .gc-golden .head   { fill: var(--gc-edge, #6B7889); }
  .gc-golden .head.focus { fill: var(--gc-path, #0084FF); }
  .gc-golden .dot    { fill: var(--gc-accent, #00ABE9); opacity: 0; } /* the only element hidden at rest */
  .gc-golden .live   { fill: var(--gc-accent, #00ABE9); }
  .gc-golden .sw     { stroke-width: 1.25; fill: none; }

  @media (prefers-reduced-motion: no-preference) {
    /* Static styles are the finished frame; keyframes carry the start state, so a
       still render (animation: none) shows the chart complete. Build-in 0–3.2s,
       live phase 3.4–6.4s, still beat to 9.6s (the host re-inserts the svg). */
    .gc-golden .box, .gc-golden .panel, .gc-golden .tile.focus {
      stroke-dasharray: 1; animation: draw 1s var(--e) both; }
    .gc-golden .chan { transform-box: fill-box; transform-origin: 50% 0; animation: grow .8s var(--e) both; }
    .gc-golden .tile, .gc-golden text, .gc-golden .rule, .gc-golden .head, .gc-golden .live {
      animation: fade .5s var(--e) both; }
    .gc-golden .rule { animation-name: fade-half; }

    .gc-golden .t0 { animation-delay: 0s }    .gc-golden .t1 { animation-delay: .15s }
    .gc-golden .t2 { animation-delay: .3s }   .gc-golden .t3 { animation-delay: .45s }
    .gc-golden .t4 { animation-delay: .6s }   .gc-golden .t5 { animation-delay: .85s }
    .gc-golden .t6 { animation-delay: 1.1s }  .gc-golden .t7 { animation-delay: 1.35s }
    .gc-golden .t8 { animation-delay: 1.6s }  .gc-golden .t9 { animation-delay: 1.85s }
    .gc-golden .t10 { animation-delay: 2.1s } .gc-golden .t11 { animation-delay: 2.4s }
    .gc-golden .t12 { animation-delay: 2.65s } .gc-golden .t13 { animation-delay: 2.9s }

    /* Live phase. Each channel owns a time --t; everything it touches keys off it:
       the box it leaves flashes as the dot departs, the channel brightens while
       the dot is on it, the dot swells into a ripple on the outline it reaches,
       and the arrowhead takes the colour for a beat. Lag between channels .15s
       (8.3), so the four read as one wave, not a queue. */
    .gc-golden .in0 { --t: 3.4s } .gc-golden .in1 { --t: 3.55s } .gc-golden .in2 { --t: 3.7s } .gc-golden .in3 { --t: 3.85s }
    .gc-golden .out0 { --t: 5.3s } .gc-golden .out1 { --t: 5.45s } .gc-golden .out2 { --t: 5.6s } .gc-golden .out3 { --t: 5.75s }

    .gc-golden .dot   { offset-path: var(--p); animation: travel .7s var(--e) var(--t) both; }
    .gc-golden .ripple{ fill: none; stroke: var(--gc-accent, #00ABE9); stroke-width: 1.2; opacity: 0;
                        animation: ripple .5s var(--e) calc(var(--t) + .6s) both; }
    .gc-golden .chan.live-in, .gc-golden .chan.live-out { animation: grow .8s var(--e) both, pass .7s var(--e) var(--t) both; }
    .gc-golden .chan.live-in { animation-delay: .45s, var(--t) }
    .gc-golden .chan.live-out { animation-delay: 2.4s, var(--t) }
    .gc-golden .head.live-in { animation: fade .5s var(--e) .6s both, catch .5s var(--e) calc(var(--t) + .6s) both; }
    .gc-golden .head.live-out { animation: fade .5s var(--e) 2.65s both, catch .5s var(--e) calc(var(--t) + .6s) both; }
    /* departure flash on the box the dot leaves; arrival flash on the one it reaches */
    .gc-golden .box.leave { animation: draw 1s var(--e) .15s both, flash .45s var(--e) var(--t) both; }
    .gc-golden .box.arrive { transform-box: fill-box; transform-origin: center;
      animation: draw 1s var(--e) 2.65s both, flash .6s var(--e) calc(var(--t) + .6s) both,
                 press .6s cubic-bezier(.22, 1.2, .36, 1) calc(var(--t) + .62s) both; }
    .gc-golden .cap.arrive { animation: fade .5s var(--e) 2.9s both, brighten .7s var(--e) calc(var(--t) + .62s) both; }
    /* the panel acknowledges the wave once, as the last dot lands, then Cohorts lights */
    .gc-golden .panel { animation: draw 1s var(--e) .85s both, flash 1.1s var(--e) 4.0s both; }
    .gc-golden .tile.focus { transform-box: fill-box; transform-origin: center;
      animation: draw 1s var(--e) 1.35s both, indicate .7s var(--e) 4.7s both; }

    @keyframes draw      { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
    @keyframes grow      { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    @keyframes fade      { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fade-half { from { opacity: 0 } to { opacity: .5 } }
    @keyframes travel    { 0% { offset-distance: 0%; opacity: 0; r: 1.5 } 15% { opacity: 1; r: 3 }
                           88% { opacity: 1; r: 3 } 100% { offset-distance: 100%; opacity: 0; r: 1 } }
    @keyframes ripple    { 0% { r: 3; opacity: 0 } 12% { opacity: .9 } 100% { r: 14; opacity: 0 } }
    @keyframes pass      { 0%, 100% { stroke: var(--gc-edge, #6B7889) } 50% { stroke: var(--gc-accent, #00ABE9) } }
    @keyframes catch     { 0%, 100% { fill: var(--gc-edge, #6B7889) } 30% { fill: var(--gc-accent, #00ABE9) } }
    @keyframes flash     { 0%, 100% { stroke: var(--gc-edge, #6B7889) } 35% { stroke: var(--gc-accent, #00ABE9) } }
    @keyframes press     { 0% { transform: scale(1) } 30% { transform: scale(1.03) } 100% { transform: scale(1) } }
    @keyframes brighten  { 0%, 100% { fill: var(--gc-quiet, #8794A3) } 30% { fill: var(--gc-ink, #FFFFFF) } }
    @keyframes indicate  { 0%, 100% { stroke: var(--gc-path, #0084FF); transform: scale(1) } 40% { stroke: var(--gc-accent, #00ABE9); transform: scale(1.03) } }
    /* the accent path keeps its own colour through the flashes */
    .gc-golden .chan.focus.live-in, .gc-golden .chan.focus.live-out { animation-name: grow, pass-focus; }
    .gc-golden .head.focus.live-in, .gc-golden .head.focus.live-out { animation-name: fade, catch-focus; }
    .gc-golden .box.focus.leave { animation-name: draw, flash-focus; }
    .gc-golden .box.focus.arrive { animation-name: draw, flash-focus, press; }
    @keyframes pass-focus  { 0%, 100% { stroke: var(--gc-path, #0084FF) } 50% { stroke: var(--gc-accent, #00ABE9) } }
    @keyframes catch-focus { 0%, 100% { fill: var(--gc-path, #0084FF) } 30% { fill: var(--gc-accent, #00ABE9) } }
    @keyframes flash-focus { 0%, 100% { stroke: var(--gc-path, #0084FF) } 35% { stroke: var(--gc-accent, #00ABE9) } }
  }
</style>

<rect class="bg" width="1000" height="672"/>

<!-- title block (7.1, 10.1): the one loud element is the title -->
<text class="kicker t0" x="104" y="56">4GEEKS · BREATHECODE · HOW A COHORT RUNS</text>
